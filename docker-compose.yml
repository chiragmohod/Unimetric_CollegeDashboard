# Docker Compose for local development with multiple database options

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: unimetric-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-unimetric}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - unimetric-network

  # MySQL Database (optional)
  mysql:
    image: mysql:8
    container_name: unimetric-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-unimetric}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_USER: ${DB_USER:-unimetric}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - unimetric-network
    profiles:
      - mysql

  # MongoDB (optional)
  mongo:
    image: mongo:6
    container_name: unimetric-mongo
    environment:
      MONGO_INITDB_DATABASE: ${DB_NAME:-unimetric}
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - unimetric-network
    profiles:
      - mongodb

  # Redis Cache (optional)
  redis:
    image: redis:7-alpine
    container_name: unimetric-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - unimetric-network
    profiles:
      - cache

  # Backend Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unimetric-backend
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_TYPE: ${DATABASE_TYPE:-local}
      # PostgreSQL
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-unimetric}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-unimetric}
      # Gemini API
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - unimetric-network
    command: npm run serve

  # Frontend Application (optional)
  frontend:
    image: node:20-alpine
    container_name: unimetric-frontend
    working_dir: /app
    environment:
      VITE_API_BASE_URL: http://localhost:4000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - unimetric-network
    command: npm run dev
    profiles:
      - frontend

volumes:
  postgres_data:
  mysql_data:
  mongo_data:

networks:
  unimetric-network:
    driver: bridge

# Usage:
# 
# For PostgreSQL (default):
#   docker-compose up -d
#
# For MySQL:
#   docker-compose --profile mysql up -d
#
# For MongoDB:
#   docker-compose --profile mongodb up -d
#
# For Redis cache:
#   docker-compose --profile cache up -d
#
# With frontend:
#   docker-compose --profile frontend up -d
#
# Multiple profiles:
#   docker-compose --profile mysql --profile cache up -d
#
# View logs:
#   docker-compose logs -f backend
#
# Stop services:
#   docker-compose down
#
# Clean everything:
#   docker-compose down -v
